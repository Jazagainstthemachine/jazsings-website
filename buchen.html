<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaz Sings – Jetzt buchen</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; font-weight: 300; color: #333; background: #f0f8ff; }

        nav {
            background: #1a1a2e;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .nav-logo img { height: 50px; }
        .nav-logo span {
            color: #a8d8ea;
            font-size: 1.5rem;
            letter-spacing: 2px;
            font-weight: bold;
        }
        .nav-menu {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .nav-menu a {
            color: white;
            text-decoration: none;
            font-size: 0.95rem;
            letter-spacing: 1px;
            padding: 5px 0;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }
        .nav-menu a:hover {
            border-bottom: 2px solid #a8d8ea;
            color: #a8d8ea;
        }
        .nav-icons {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .nav-icons a {
            color: #a8d8ea;
            text-decoration: none;
            font-size: 0.8rem;
            border: 1px solid #a8d8ea;
            padding: 4px 10px;
            border-radius: 20px;
            transition: all 0.3s;
        }
        .nav-icons a:hover {
            background: #a8d8ea;
            color: #1a1a2e;
        }

        .divider {
            height: 25px;
            background: linear-gradient(135deg, #5fb3b3, #7b9ea8, #9b7fa8);
        }

        .page-header {
            text-align: center;
            padding: 50px 20px 30px;
            background: #1a1a2e;
            color: white;
        }
        .page-header h1 {
            font-size: clamp(2.8rem, 6vw, 4.5rem);
            font-family: 'Cormorant Garamond', serif;
            font-weight: 300;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #a8d8ea;
            margin-bottom: 10px;
        }
        .page-header p {
            font-size: 0.85rem;
            color: #aaa;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .form-container {
            max-width: 700px;
            margin: 50px auto;
            background: white;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 35px;
        }
        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #1a1a2e;
            margin-bottom: 15px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .option-label {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f0f8ff;
            border: 2px solid #a8d8ea;
            border-radius: 10px;
            padding: 12px 15px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.95rem;
        }
        .option-label:hover {
            background: #a8d8ea;
            color: #1a1a2e;
        }
        .option-label input {
            accent-color: #7b68ee;
        }

        .text-input, .date-input, .textarea-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #a8d8ea;
            border-radius: 10px;
            font-size: 0.9rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            color: #333;
            background: #f0f8ff;
            transition: all 0.3s;
        }
        .text-input:focus, .date-input:focus, .textarea-input:focus {
            outline: none;
            border-color: #7b68ee;
            background: white;
        }
        .textarea-input {
            height: 150px;
            resize: vertical;
        }

        .location-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .btn-submit {
            display: block;
            width: 100%;
            background: #7b68ee;
            color: white;
            padding: 18px;
            font-size: 1.3rem;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.3s;
            font-family: 'Montserrat', sans-serif;
        }
        .btn-submit:hover {
            background: #5a4fcf;
            transform: scale(1.02);
        }

        footer {
            background: #111;
            color: #aaa;
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
            margin-top: 50px;
        }
        footer a { color: #a8d8ea; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-logo">
            <img src="images/Hauptseite/hauptseite-logo.jpg" alt="Jaz Sings Logo">
            <span>JAZ SINGS</span>
        </div>
        <div class="nav-menu">
            <a href="index.html">Home</a>
            <a href="galerie.html">Galerie</a>
            <a href="shows.html">Shows</a>
            <a href="shop.html">Shop</a>
            <a href="kontakt.html">Kontakt</a>
        </div>
        <div class="nav-icons">
            <a href="https://www.instagram.com/jaz__sings/" target="_blank">Instagram</a>
            <a href="https://www.facebook.com/jazsingz" target="_blank">Facebook</a>
            <a href="https://www.tiktok.com/@jaz__sings" target="_blank">TikTok</a>
            <a href="https://www.youtube.com/@jazsings" target="_blank">YouTube</a>
            <a href="https://T.me/jazsings" target="_blank">Telegram</a>
            <a href="https://wa.me/491772252520" target="_blank">WhatsApp</a>
            <a href="mailto:Info@jazsings.com">E-Mail</a>
        </div>
    </nav>

    <div class="divider"></div>

    <div class="page-header">
        <h1>Jetzt buchen 🎵</h1>
        <p>Füll das Formular aus und ich melde mich so schnell wie möglich bei dir!</p>
    </div>

    <div class="divider"></div>

    <div class="form-container">
        <form action="https://formspree.io/f/xnjwwwnb" method="POST">

            <!-- NAME & KONTAKT -->
            <div class="form-group">
                <label>Dein Name *</label>
                <input type="text" name="name" class="text-input" placeholder="Vor- und Nachname" required>
            </div>

            <div class="form-group">
                <label>Deine E-Mail *</label>
                <input type="email" name="email" class="text-input" placeholder="deine@email.de" required>
            </div>

            <div class="form-group">
                <label>Deine Telefonnummer</label>
                <input type="tel" name="telefon" class="text-input" placeholder="+49 ...">
            </div>

            <!-- ART DES EVENTS -->
            <div class="form-group">
                <label>Was möchten Sie veranstalten? *</label>
                <div class="options-grid">
                    <label class="option-label">
                        <input type="radio" name="event_art" value="Traumhochzeit" required>
                        💍 Traumhochzeit
                    </label>
                    <label class="option-label">
                        <input type="radio" name="event_art" value="Firmenevent">
                        🏢 Firmenevent
                    </label>
                    <label class="option-label">
                        <input type="radio" name="event_art" value="Geburtstag">
                        🎂 Geburtstag
                    </label>
                    <label class="option-label">
                        <input type="radio" name="event_art" value="Sonstiges">
                        ✨ Sonstiges
                    </label>
                </div>
            </div>

            <!-- GÄSTE -->
            <div class="form-group">
                <label>Mit wieviel Gästen rechnen Sie ungefähr? *</label>
                <div class="options-grid">
                    <label class="option-label">
                        <input type="radio" name="gaeste" value="10-50" required>
                        👥 10 – 50 Gäste
                    </label>
                    <label class="option-label">
                        <input type="radio" name="gaeste" value="50-100">
                        👥 50 – 100 Gäste
                    </label>
                    <label class="option-label">
                        <input type="radio" name="gaeste" value="100-200">
                        👥 100 – 200 Gäste
                    </label>
                    <label class="option-label">
                        <input type="radio" name="gaeste" value="300+">
                        👥 300 und mehr
                    </label>
                    <label class="option-label" style="grid-column: span 2;">
                        <input type="radio" name="gaeste" value="Sonstiges">
                        ✏️ Sonstiges
                    </label>
                </div>
            </div>

            <!-- DATUM -->
            <div class="form-group">
                <label>An welchem Datum ist das Event geplant? *</label>
                <input type="date" name="datum" class="date-input" required>
                <p style="margin-top:10px; font-size:0.9rem; color:#888;">Noch kein festes Datum?</p>
                <input type="text" name="datum_sonstiges" class="text-input" style="margin-top:8px;" placeholder="z.B. Sommer 2026, noch offen...">
            </div>

            <!-- ORT -->
            <div class="form-group">
                <label>Wo wollen Sie feiern?</label>
                <div class="location-grid">
                    <input type="text" name="plz" class="text-input" placeholder="PLZ">
                    <input type="text" name="ort" class="text-input" placeholder="Ort">
                </div>
                <input type="text" name="location_name" class="text-input" placeholder="Name der Location (optional)">
            </div>

            <!-- ZUSÄTZLICHE INFOS -->
            <div class="form-group">
                <label>Zusätzliche Informationen</label>
                <textarea name="zusatz" class="textarea-input" placeholder="z.B. geplanter Zeitrahmen, besondere Wünsche, Musikstil..."></textarea>
            </div>

            <button type="submit" class="btn-submit">🎵 Buchungsanfrage absenden</button>

        </form>
    </div>

    <footer>
        <p>© 2026 Jaz Sings · <a href="mailto:Info@jazsings.com">Info@jazsings.com</a></p>
    </footer>

</body>
</html>
