<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop – Jaz Sings</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --hellblau: #a8d8ea;
      --dunkelblau: #1a1a2e;
      --flieder: #7b68ee;
      --trennlinie: linear-gradient(135deg, #5fb3b3, #7b9ea8, #9b7fa8);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--dunkelblau); color: #f0eee8; font-family: 'Montserrat', sans-serif; font-weight: 300; min-height: 100vh; display: flex; flex-direction: column; }
    nav { background: var(--dunkelblau); padding: 18px 40px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(168,216,234,0.15); }
    .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .nav-logo img { height: 48px; width: 48px; border-radius: 50%; object-fit: cover; }
    .nav-logo span { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; font-weight: 600; color: var(--hellblau); letter-spacing: 3px; text-transform: uppercase; }
    .nav-links { display: flex; gap: 32px; list-style: none; }
    .nav-links a { color: #ccc; text-decoration: none; font-size: 0.78rem; letter-spacing: 2px; text-transform: uppercase; transition: color 0.3s; }
    .nav-links a:hover, .nav-links a.active { color: var(--hellblau); }
    .divider { height: 25px; background: var(--trennlinie); }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 60px 20px; }
    .icon { font-size: 3.5rem; margin-bottom: 24px; opacity: 0.6; }
    h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(2.5rem, 5vw, 4rem); font-weight: 300; letter-spacing: 6px; text-transform: uppercase; color: var(--hellblau); margin-bottom: 20px; }
    p { font-size: 0.9rem; letter-spacing: 2px; color: #aaa; line-height: 2; }
    .back-link { margin-top: 40px; display: inline-block; padding: 10px 28px; border: 1px solid rgba(168,216,234,0.35); border-radius: 2px; color: var(--hellblau); font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; text-decoration: none; transition: background 0.3s; }
    .back-link:hover { background: rgba(168,216,234,0.1); }
    footer { background: #0d0d1a; text-align: center; padding: 30px 20px; font-size: 0.75rem; letter-spacing: 2px; color: #555; text-transform: uppercase; }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">
    <img src="images/Hauptseite/hauptseite-logo.jpg" alt="Jaz Sings Logo" />
    <span>Jaz Sings</span>
  </a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="galerie.html">Galerie</a></li>
    <li><a href="shows.html">Shows</a></li>
    <li><a href="shop.html" class="active">Shop</a></li>
    <li><a href="kontakt.html">Kontakt</a></li>
  </ul>
</nav>
<div class="divider"></div>
<main>
  <div class="icon">🛍️</div>
  <h1>Shop</h1>
  <p>Hier wird gerade gebaut –<br>schau in Kürze noch einmal rein! :-)</p>
  <a class="back-link" href="index.html">← Zurück zur Startseite</a>
</main>
<div class="divider"></div>
<footer>© 2025 Jaz Sings</footer>
</body>
</html>
